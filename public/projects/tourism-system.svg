<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Dark Minimal Background Gradient -->
    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F14" />
      <stop offset="50%" stop-color="#11131A" />
      <stop offset="100%" stop-color="#151722" />
    </linearGradient>

    <!-- Subtle Ambient Accent Glow -->
    <radialGradient id="ts-glow" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#ts-bg)" />
  <rect width="800" height="500" fill="url(#ts-glow)" />

  <!-- Subtle Minimal Frame -->
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="#242838" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(70, 95)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="205" height="30" rx="15" fill="#1A1C28" stroke="#2B2F44" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#FF6B4A" />
    <text x="28" y="19" fill="#FF6B4A" font-size="11" font-family="monospace" font-weight="700" letter-spacing="1">JAVA WEB APPLICATION</text>

    <!-- Project Title -->
    <text x="0" y="95" fill="#F4F3F1" font-size="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="-1.5">
      Tourism Management System
    </text>

    <!-- Minimal Accent Line -->
    <line x1="0" y1="125" x2="48" y2="125" stroke="#FF6B4A" stroke-width="3.5" stroke-linecap="round" />

    <!-- Clean Typography Description -->
    <text x="0" y="175" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      Integrated travel booking portal for exploring vacation packages,
    </text>
    <text x="0" y="205" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      reserving luxury hotel suites, and managing relational booking records.
    </text>

    <!-- Minimal Tech Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="70" height="32" rx="8" fill="#171924" stroke="#282C3D" stroke-width="1" />
      <text x="17" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Java</text>

      <rect x="82" y="0" width="125" height="32" rx="8" fill="#171924" stroke="#282C3D" stroke-width="1" />
      <text x="96" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">JSP &amp; Servlets</text>

      <rect x="219" y="0" width="80" height="32" rx="8" fill="#171924" stroke="#282C3D" stroke-width="1" />
      <text x="235" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">MySQL</text>

      <rect x="311" y="0" width="100" height="32" rx="8" fill="#171924" stroke="#282C3D" stroke-width="1" />
      <text x="325" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Bootstrap</text>
    </g>
  </g>
</svg>
