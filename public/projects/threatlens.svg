<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Dark Minimal Background Gradient -->
    <linearGradient id="tl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A100D" />
      <stop offset="50%" stop-color="#0E1715" />
      <stop offset="100%" stop-color="#14201C" />
    </linearGradient>

    <!-- Subtle Cyber Ambient Accent Glow -->
    <radialGradient id="tl-glow" cx="85%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0E1715" stop-opacity="0" />
    </radialGradient>

    <!-- Grid lines pattern -->
    <pattern id="tl-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#tl-bg)" />
  <rect width="800" height="500" fill="url(#tl-grid)" />
  <rect width="800" height="500" fill="url(#tl-glow)" />

  <!-- Subtle Minimal Frame -->
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="#1C3029" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(70, 90)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="195" height="30" rx="15" fill="#132620" stroke="#1D4035" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#10B981" />
    <text x="28" y="19" fill="#10B981" font-size="10.5" font-family="monospace" font-weight="700" letter-spacing="1">AI &amp; CYBERSECURITY</text>

    <!-- Project Title -->
    <text x="0" y="92" fill="#F4F3F1" font-size="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="-1.5">
      ThreatLens AI
    </text>

    <!-- Minimal Accent Line -->
    <line x1="0" y1="120" x2="52" y2="120" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />

    <!-- Clean Typography Description -->
    <text x="0" y="168" fill="#9B9995" font-size="16.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      Autonomous cyber threat intelligence &amp; forensic inspection platform.
    </text>
    <text x="0" y="196" fill="#9B9995" font-size="16.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      69-feature URL deobfuscation, explainable NLP email scanner &amp; network ML.
    </text>

    <!-- Minimal Tech Pills -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="88" height="32" rx="8" fill="#12241F" stroke="#1D3E33" stroke-width="1" />
      <text x="16" y="20" fill="#D1FAE5" font-size="12" font-family="system-ui, sans-serif" font-weight="500">FastAPI</text>

      <rect x="98" y="0" width="88" height="32" rx="8" fill="#12241F" stroke="#1D3E33" stroke-width="1" />
      <text x="16" y="20" fill="#D1FAE5" font-size="12" font-family="system-ui, sans-serif" font-weight="500" transform="translate(98, 0)">PyTorch</text>

      <rect x="196" y="0" width="105" height="32" rx="8" fill="#12241F" stroke="#1D3E33" stroke-width="1" />
      <text x="14" y="20" fill="#D1FAE5" font-size="12" font-family="system-ui, sans-serif" font-weight="500" transform="translate(196, 0)">Scikit-Learn</text>

      <rect x="311" y="0" width="90" height="32" rx="8" fill="#12241F" stroke="#1D3E33" stroke-width="1" />
      <text x="15" y="20" fill="#D1FAE5" font-size="12" font-family="system-ui, sans-serif" font-weight="500" transform="translate(311, 0)">React 19</text>

      <rect x="411" y="0" width="85" height="32" rx="8" fill="#12241F" stroke="#1D3E33" stroke-width="1" />
      <text x="17" y="20" fill="#D1FAE5" font-size="12" font-family="system-ui, sans-serif" font-weight="500" transform="translate(411, 0)">Docker</text>
    </g>
  </g>
</svg>
