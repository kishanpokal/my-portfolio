<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Dark Minimal Background Gradient -->
    <linearGradient id="def-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F14" />
      <stop offset="50%" stop-color="#111218" />
      <stop offset="100%" stop-color="#161720" />
    </linearGradient>

    <!-- Subtle Ambient Accent Glow -->
    <radialGradient id="def-glow" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#def-bg)" />
  <rect width="800" height="500" fill="url(#def-glow)" />

  <!-- Subtle Minimal Frame -->
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="#232430" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(70, 95)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="190" height="30" rx="15" fill="#1A1B25" stroke="#2C2E3E" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#FF6B4A" />
    <text x="28" y="19" fill="#FF6B4A" font-size="11" font-family="monospace" font-weight="700" letter-spacing="1">ENGINEERING SHOWCASE</text>

    <!-- Project Title -->
    <text x="0" y="95" fill="#F4F3F1" font-size="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="-1.5">
      Software Project
    </text>

    <!-- Minimal Accent Line -->
    <line x1="0" y1="125" x2="48" y2="125" stroke="#FF6B4A" stroke-width="3.5" stroke-linecap="round" />

    <!-- Clean Typography Description -->
    <text x="0" y="175" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      Production software application architecture, full-stack systems
    </text>
    <text x="0" y="205" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      engineering, cloud integration, and verified test suites.
    </text>

    <!-- Minimal Tech Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="100" height="32" rx="8" fill="#171822" stroke="#282A3A" stroke-width="1" />
      <text x="16" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Full-Stack</text>

      <rect x="112" y="0" width="145" height="32" rx="8" fill="#171822" stroke="#282A3A" stroke-width="1" />
      <text x="127" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Clean Architecture</text>

      <rect x="269" y="0" width="95" height="32" rx="8" fill="#171822" stroke="#282A3A" stroke-width="1" />
      <text x="285" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">REST APIs</text>
    </g>
  </g>
</svg>
