<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aw-canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101015" />
      <stop offset="100%" stop-color="#161620" />
    </linearGradient>
    <linearGradient id="aw-chart-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Complete Full-Bleed Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#aw-canvas-bg)" />

  <!-- ━━━━━━━━ TOP HEADER BAR (Edge-to-Edge 0 to 800) ━━━━━━━━ -->
  <rect x="0" y="0" width="800" height="52" fill="#1C1C24" />
  <line x1="0" y1="52" x2="800" y2="52" stroke="#2B2B36" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="28" cy="26" r="5" fill="#EF4444" opacity="0.85" />
  <circle cx="44" cy="26" r="5" fill="#F59E0B" opacity="0.85" />
  <circle cx="60" cy="26" r="5" fill="#10B981" opacity="0.85" />

  <!-- Domain Bar -->
  <rect x="150" y="12" width="340" height="28" rx="8" fill="#101015" stroke="#2B2B36" stroke-width="1" />
  <text x="210" y="30" fill="#94918C" font-size="11" font-family="monospace">attendmateweb.vercel.app</text>

  <!-- Status -->
  <rect x="660" y="12" width="115" height="28" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
  <text x="680" y="30" fill="#10B981" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">● ONLINE</text>

  <!-- ━━━━━━━━ METRICS ROW (0 to 800, 52 to 140) ━━━━━━━━ -->
  <g transform="translate(24, 70)">
    <rect x="0" y="0" width="235" height="60" rx="12" fill="#1A1A22" stroke="#2B2B36" stroke-width="1" />
    <text x="16" y="22" fill="#94918C" font-size="10" font-family="system-ui, sans-serif">Total Enrolled</text>
    <text x="16" y="46" fill="#F4F3F1" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">1,248 Students</text>

    <rect x="255" y="0" width="235" height="60" rx="12" fill="#1A1A22" stroke="#2B2B36" stroke-width="1" />
    <text x="271" y="22" fill="#94918C" font-size="10" font-family="system-ui, sans-serif">Average Attendance</text>
    <text x="271" y="46" fill="#FF6B4A" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">91.4% Rate</text>

    <rect x="510" y="0" width="242" height="60" rx="12" fill="#1A1A22" stroke="#2B2B36" stroke-width="1" />
    <text x="526" y="22" fill="#94918C" font-size="10" font-family="system-ui, sans-serif">Active Batches</text>
    <text x="526" y="46" fill="#F59E0B" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">12 Divisions</text>
  </g>

  <!-- ━━━━━━━━ LOWER DATA PANELS (145 to 500) ━━━━━━━━ -->
  <g transform="translate(24, 150)">
    <!-- Chart Box -->
    <rect x="0" y="0" width="480" height="325" rx="14" fill="#16161E" stroke="#2B2B36" stroke-width="1" />
    <text x="20" y="28" fill="#F4F3F1" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Monthly Attendance Frequency Trends</text>
    
    <!-- Connected chart bars -->
    <g transform="translate(30, 60)">
      <line x1="0" y1="220" x2="420" y2="220" stroke="#2B2B36" stroke-width="1" />
      <line x1="0" y1="150" x2="420" y2="150" stroke="#2B2B36" stroke-dasharray="4,4" stroke-width="1" />
      <line x1="0" y1="80" x2="420" y2="80" stroke="#2B2B36" stroke-dasharray="4,4" stroke-width="1" />

      <rect x="20" y="100" width="36" height="120" rx="6" fill="#2B2B38" />
      <rect x="75" y="70" width="36" height="150" rx="6" fill="#2B2B38" />
      <rect x="130" y="30" width="36" height="190" rx="6" fill="url(#aw-chart-bar)" />
      <rect x="185" y="55" width="36" height="165" rx="6" fill="#2B2B38" />
      <rect x="240" y="20" width="36" height="200" rx="6" fill="url(#aw-chart-bar)" />
      <rect x="295" y="45" width="36" height="175" rx="6" fill="#2B2B38" />
      <rect x="350" y="15" width="36" height="205" rx="6" fill="url(#aw-chart-bar)" />
    </g>

    <!-- Student Roster Box (Connected Right) -->
    <rect x="498" y="0" width="254" height="325" rx="14" fill="#16161E" stroke="#2B2B36" stroke-width="1" />
    <text x="514" y="28" fill="#F4F3F1" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Recent Records</text>

    <g transform="translate(514, 48)">
      <rect x="0" y="0" width="222" height="48" rx="10" fill="#1C1C24" stroke="#2B2B36" stroke-width="1" />
      <text x="12" y="22" fill="#F4F3F1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Rahul Patel</text>
      <text x="12" y="38" fill="#94918C" font-size="9" font-family="system-ui, sans-serif">CS • Roll 104</text>
      <text x="165" y="30" fill="#10B981" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Present</text>

      <rect x="0" y="56" width="222" height="48" rx="10" fill="#1C1C24" stroke="#2B2B36" stroke-width="1" />
      <text x="12" y="78" fill="#F4F3F1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Neha Shah</text>
      <text x="12" y="94" fill="#94918C" font-size="9" font-family="system-ui, sans-serif">CS • Roll 108</text>
      <text x="165" y="86" fill="#10B981" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Present</text>

      <rect x="0" y="112" width="222" height="48" rx="10" fill="#1C1C24" stroke="#2B2B36" stroke-width="1" />
      <text x="12" y="134" fill="#F4F3F1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Arjun Dave</text>
      <text x="12" y="150" fill="#94918C" font-size="9" font-family="system-ui, sans-serif">CS • Roll 112</text>
      <text x="165" y="142" fill="#10B981" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Present</text>

      <rect x="0" y="168" width="222" height="48" rx="10" fill="#1C1C24" stroke="#2B2B36" stroke-width="1" />
      <text x="12" y="190" fill="#F4F3F1" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Priya Sharma</text>
      <text x="12" y="206" fill="#94918C" font-size="9" font-family="system-ui, sans-serif">CS • Roll 115</text>
      <text x="168" y="198" fill="#EF4444" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Absent</text>
    </g>
  </g>

  <!-- Complete Outer Border Frame -->
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#2B2B36" stroke-width="2" />
</svg>
