<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Dark Minimal Background Gradient -->
    <linearGradient id="cg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="50%" stop-color="#111317" />
      <stop offset="100%" stop-color="#161A20" />
    </linearGradient>

    <!-- Subtle Ambient Accent Glow -->
    <radialGradient id="cg-glow" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#cg-bg)" />
  <rect width="800" height="500" fill="url(#cg-glow)" />

  <!-- Subtle Minimal Frame -->
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="#232B32" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(70, 95)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="135" height="30" rx="15" fill="#15211D" stroke="#243831" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#10B981" />
    <text x="28" y="19" fill="#10B981" font-size="11" font-family="monospace" font-weight="700" letter-spacing="1">WEB GAME</text>

    <!-- Project Title -->
    <text x="0" y="95" fill="#F4F3F1" font-size="50" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="-1.5">
      Multiplayer Cricket Game
    </text>

    <!-- Minimal Accent Line -->
    <line x1="0" y1="125" x2="48" y2="125" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />

    <!-- Clean Typography Description -->
    <text x="0" y="175" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      Real-time browser-based cricket arena featuring live matchmaking lobby,
    </text>
    <text x="0" y="205" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      interactive turn-based gameplay, player stats, and global leaderboards.
    </text>

    <!-- Minimal Tech Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="90" height="32" rx="8" fill="#151C1B" stroke="#25322F" stroke-width="1" />
      <text x="16" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">React 19</text>

      <rect x="102" y="0" width="105" height="32" rx="8" fill="#151C1B" stroke="#25322F" stroke-width="1" />
      <text x="116" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">TypeScript</text>

      <rect x="219" y="0" width="90" height="32" rx="8" fill="#151C1B" stroke="#25322F" stroke-width="1" />
      <text x="233" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Firebase</text>

      <rect x="321" y="0" width="130" height="32" rx="8" fill="#151C1B" stroke="#25322F" stroke-width="1" />
      <text x="335" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">TailwindCSS v4</text>
    </g>
  </g>
</svg>
