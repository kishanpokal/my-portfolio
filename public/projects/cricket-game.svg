<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Decorative background elements for a cricket game feel -->
  <circle cx="300" cy="200" r="120" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.1" />
  <rect x="250" y="100" width="100" height="200" rx="10" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.15" />
  <circle cx="300" cy="200" r="20" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.15" />
  <text x="50%" y="45%" font-size="44" fill="#22c55e" font-weight="bold" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">
    Cricket Game
  </text>
  <text x="50%" y="62%" font-size="18" fill="#e2e8f0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1">
    Web Interactive Game
  </text>
</svg>
