<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aa-canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101015" />
      <stop offset="100%" stop-color="#161622" />
    </linearGradient>
    <linearGradient id="aa-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Complete Full-Bleed Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#aa-canvas-bg)" />

  <!-- ━━━━━━━━ TOP HEADER BAR (Edge-to-Edge 0 to 800) ━━━━━━━━ -->
  <rect x="0" y="0" width="800" height="52" fill="#1A1A24" />
  <line x1="0" y1="52" x2="800" y2="52" stroke="#2B2B38" stroke-width="1.5" />

  <circle cx="28" cy="26" r="5" fill="#EF4444" opacity="0.85" />
  <circle cx="44" cy="26" r="5" fill="#F59E0B" opacity="0.85" />
  <circle cx="60" cy="26" r="5" fill="#10B981" opacity="0.85" />

  <rect x="150" y="12" width="340" height="28" rx="8" fill="#101015" stroke="#2B2B38" stroke-width="1" />
  <text x="210" y="30" fill="#94918C" font-size="11" font-family="monospace">attendmate.student.android</text>

  <rect x="660" y="12" width="115" height="28" rx="8" fill="#FF6B4A" fill-opacity="0.15" stroke="#FF6B4A" stroke-opacity="0.3" stroke-width="1" />
  <text x="675" y="30" fill="#FF6B4A" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">● ANDROID</text>

  <!-- ━━━━━━━━ MAIN INTERFACE (0 to 800, 52 to 500) ━━━━━━━━ -->
  <!-- Left Side: Attendance Score & Metric Summary (0 to 420) -->
  <g transform="translate(24, 70)">
    <rect x="0" y="0" width="420" height="190" rx="16" fill="#181822" stroke="#2B2B38" stroke-width="1" />
    
    <!-- Circular Attendance Ring Visual -->
    <circle cx="95" cy="95" r="55" fill="none" stroke="#282836" stroke-width="12" />
    <circle cx="95" cy="95" r="55" fill="none" stroke="url(#aa-ring-grad)" stroke-width="12" stroke-dasharray="345" stroke-dashoffset="48" stroke-linecap="round" transform="rotate(-90 95 95)" />
    <text x="95" y="103" fill="#F4F3F1" font-size="22" font-family="system-ui, sans-serif" font-weight="extrabold" text-anchor="middle">88%</text>

    <!-- Ring Details -->
    <text x="180" y="65" fill="#F4F3F1" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">Good Standing</text>
    <text x="180" y="88" fill="#94918C" font-size="12" font-family="system-ui, sans-serif">Lectures Attended: 44 / 50</text>
    <rect x="180" y="102" width="120" height="26" rx="8" fill="#FF6B4A" fill-opacity="0.15" />
    <text x="194" y="119" fill="#FF6B4A" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">Safe Threshold</text>

    <!-- Lower Summary Card -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="420" height="198" rx="16" fill="#181822" stroke="#2B2B38" stroke-width="1" />
      <text x="24" y="32" fill="#F4F3F1" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Firebase Cloud Real-Time Status</text>

      <g transform="translate(24, 52)">
        <text x="0" y="16" fill="#94918C" font-size="11" font-family="monospace">AUTHENTICATION: Firebase Auth</text>
        <text x="0" y="42" fill="#94918C" font-size="11" font-family="monospace">DATABASE: Cloud Firestore Rules</text>
        <text x="0" y="68" fill="#FF6B4A" font-size="11" font-family="monospace">OFFLINE CACHE: Room SQLite Local</text>
        <text x="0" y="94" fill="#10B981" font-size="11" font-family="monospace">SYNC LATENCY: sub-20ms</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Subjects Breakdown List (460 to 800) -->
  <g transform="translate(460, 70)">
    <rect x="0" y="0" width="316" height="408" rx="16" fill="#181822" stroke="#2B2B38" stroke-width="1" />
    <text x="20" y="32" fill="#F4F3F1" font-size="13" font-family="system-ui, sans-serif" font-weight="bold">Subject Attendance Breakdown</text>

    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="276" height="72" rx="12" fill="#1F1F2C" stroke="#2E2E40" stroke-width="1" />
      <text x="14" y="28" fill="#F4F3F1" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Data Structures &amp; Algo</text>
      <text x="14" y="48" fill="#94918C" font-size="10" font-family="system-ui, sans-serif">18 / 20 Lectures Attended</text>
      <text x="215" y="38" fill="#FF6B4A" font-size="16" font-family="system-ui, sans-serif" font-weight="extrabold">90%</text>

      <rect x="0" y="82" width="276" height="72" rx="12" fill="#1F1F2C" stroke="#2E2E40" stroke-width="1" />
      <text x="14" y="110" fill="#F4F3F1" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Machine Learning Systems</text>
      <text x="14" y="130" fill="#94918C" font-size="10" font-family="system-ui, sans-serif">14 / 16 Lectures Attended</text>
      <text x="215" y="120" fill="#FF6B4A" font-size="16" font-family="system-ui, sans-serif" font-weight="extrabold">87%</text>

      <rect x="0" y="164" width="276" height="72" rx="12" fill="#1F1F2C" stroke="#2E2E40" stroke-width="1" />
      <text x="14" y="192" fill="#F4F3F1" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Database Management (SQL)</text>
      <text x="14" y="212" fill="#94918C" font-size="10" font-family="system-ui, sans-serif">12 / 14 Lectures Attended</text>
      <text x="215" y="202" fill="#FF6B4A" font-size="16" font-family="system-ui, sans-serif" font-weight="extrabold">85%</text>

      <rect x="0" y="246" width="276" height="72" rx="12" fill="#1F1F2C" stroke="#2E2E40" stroke-width="1" />
      <text x="14" y="274" fill="#F4F3F1" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Object Oriented Systems</text>
      <text x="14" y="294" fill="#94918C" font-size="10" font-family="system-ui, sans-serif">15 / 16 Lectures Attended</text>
      <text x="215" y="284" fill="#10B981" font-size="16" font-family="system-ui, sans-serif" font-weight="extrabold">93%</text>
    </g>
  </g>

  <!-- Complete Outer Border Frame -->
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#2B2B38" stroke-width="2" />
</svg>
