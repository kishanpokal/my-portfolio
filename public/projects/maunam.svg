<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="m-canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B090E" />
      <stop offset="50%" stop-color="#120E16" />
      <stop offset="100%" stop-color="#1A1118" />
    </linearGradient>
    <radialGradient id="entity-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
