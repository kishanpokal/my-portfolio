  </defs>

  <!-- Complete Full-Bleed Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#m-canvas-bg)" />

  <!-- ━━━━━━━━ TOP HUD HEADER BAR (0 to 800) ━━━━━━━━ -->
  <rect x="0" y="0" width="800" height="52" fill="#161018" />
  <line x1="0" y1="52" x2="800" y2="52" stroke="#2D1F2E" stroke-width="1.5" />

  <circle cx="28" cy="26" r="5" fill="#EF4444" opacity="0.85" />
  <circle cx="44" cy="26" r="5" fill="#F59E0B" opacity="0.85" />
  <circle cx="60" cy="26" r="5" fill="#10B981" opacity="0.85" />

  <rect x="150" y="12" width="340" height="28" rx="8" fill="#0B090E" stroke="#2D1F2E" stroke-width="1" />
  <text x="210" y="30" fill="#F4F3F1" font-size="11" font-family="monospace">MAUNAM: THE SILENT GOD • UNITY</text>

  <rect x="650" y="12" width="125" height="28" rx="8" fill="#FF6B4A" fill-opacity="0.15" stroke="#FF6B4A" stroke-opacity="0.3" stroke-width="1" />
  <text x="665" y="30" fill="#FF6B4A" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">● 3D HORROR AI</text>

  <!-- Atmospheric Fog & Glow -->
  <circle cx="400" cy="240" r="260" fill="url(#entity-glow)" />

  <!-- 3D Environment Silhouettes -->
