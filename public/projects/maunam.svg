<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Dark Minimal Background Gradient -->
    <linearGradient id="mau-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0C10" />
      <stop offset="50%" stop-color="#120E15" />
      <stop offset="100%" stop-color="#181018" />
    </linearGradient>

    <!-- Subtle Ambient Accent Glow -->
    <radialGradient id="mau-glow" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#mau-bg)" />
  <rect width="800" height="500" fill="url(#mau-glow)" />

  <!-- Subtle Minimal Frame -->
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="#2A1B24" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(70, 95)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="165" height="30" rx="15" fill="#1F131B" stroke="#361D2B" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#E11D48" />
    <text x="28" y="19" fill="#E11D48" font-size="11" font-family="monospace" font-weight="700" letter-spacing="1">GAME DEVELOPMENT</text>

    <!-- Project Title -->
    <text x="0" y="95" fill="#F4F3F1" font-size="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="-1">
      Maunam: The Silent God
    </text>

    <!-- Minimal Accent Line -->
    <line x1="0" y1="125" x2="48" y2="125" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" />

    <!-- Clean Typography Description -->
    <text x="0" y="175" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      Atmospheric 3D first-person mobile horror game with noise-reactive
    </text>
    <text x="0" y="205" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      mechanics where real-world microphone sounds alert the entity.
    </text>

    <!-- Minimal Tech Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="80" height="32" rx="8" fill="#191118" stroke="#301A27" stroke-width="1" />
      <text x="20" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Unity</text>

      <rect x="92" y="0" width="60" height="32" rx="8" fill="#191118" stroke="#301A27" stroke-width="1" />
      <text x="20" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500" transform="translate(92, 0)">C#</text>

      <rect x="164" y="0" width="140" height="32" rx="8" fill="#191118" stroke="#301A27" stroke-width="1" />
      <text x="178" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">3D Mobile Game</text>

      <rect x="316" y="0" width="90" height="32" rx="8" fill="#191118" stroke="#301A27" stroke-width="1" />
      <text x="331" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Horror AI</text>
    </g>
  </g>
</svg>
