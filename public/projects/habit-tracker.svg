<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Dark Minimal Background Gradient -->
    <linearGradient id="ht-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="50%" stop-color="#121218" />
      <stop offset="100%" stop-color="#181622" />
    </linearGradient>

    <!-- Subtle Ambient Accent Glow -->
    <radialGradient id="ht-glow" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#ht-bg)" />
  <rect width="800" height="500" fill="url(#ht-glow)" />

  <!-- Subtle Minimal Frame -->
  <rect x="24" y="24" width="752" height="452" rx="20" fill="none" stroke="#262534" stroke-width="1.5" />

  <!-- Content Container -->
  <g transform="translate(70, 95)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="165" height="30" rx="15" fill="#1D1B28" stroke="#302C3F" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#F59E0B" />
    <text x="28" y="19" fill="#F59E0B" font-size="11" font-family="monospace" font-weight="700" letter-spacing="1">WEB APPLICATION</text>

    <!-- Project Title -->
    <text x="0" y="95" fill="#F4F3F1" font-size="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" letter-spacing="-1.5">
      Habit Tracker Web
    </text>

    <!-- Minimal Accent Line -->
    <line x1="0" y1="125" x2="48" y2="125" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Clean Typography Description -->
    <text x="0" y="175" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      Productivity web application helping users build positive habits,
    </text>
    <text x="0" y="205" fill="#9B9995" font-size="17" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" letter-spacing="0.1">
      monitor daily routines, and sustain long-term personal consistency.
    </text>

    <!-- Minimal Tech Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="105" height="32" rx="8" fill="#181724" stroke="#2B283A" stroke-width="1" />
      <text x="17" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">JavaScript</text>

      <rect x="117" y="0" width="165" height="32" rx="8" fill="#181724" stroke="#2B283A" stroke-width="1" />
      <text x="131" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Frontend Development</text>

      <rect x="294" y="0" width="90" height="32" rx="8" fill="#181724" stroke="#2B283A" stroke-width="1" />
      <text x="310" y="20" fill="#C5C3BF" font-size="12.5" font-family="system-ui, sans-serif" font-weight="500">Web App</text>
    </g>
  </g>
</svg>
